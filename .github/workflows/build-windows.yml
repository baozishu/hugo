name: Build Windows Client

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
        cache: true
    
    - name: Install dependencies
      run: go mod tidy
    
    - name: Build Windows client
      run: go build -ldflags "-s -w" -o hugo-client-windows-amd64.exe ./cmd/hugo-client
    
    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: hugo-client-windows
        path: hugo-client-windows-amd64.exe
        retention-days: 7