name: typecho_blog_client
version: 1.0.0+1
description: A cross-platform Typecho blog client built with Flutter
environment:
  sdk: ">=2.17.0 <3.0.0"
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  http: ^0.13.5
  http_interceptor: ^1.0.2
  shared_preferences: ^2.0.15
  provider: ^6.0.2
  markdown: ^6.0.1
  html: ^0.15.0
  cached_network_image: ^3.2.3
  flutter_markdown: ^0.11.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^1.0.0
flutter:
  uses-material-design: true